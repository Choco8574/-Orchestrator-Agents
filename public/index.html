<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orchestrator Chatbox</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #111827; color: #e5e7eb; }
      .app { display: grid; grid-template-columns: 260px 1fr 320px; gap: 20px; max-width: 1400px; margin: 0 auto; padding: 24px; }
      .sidebar,
      .chat-panel,
      .workflow-panel {
        border: 1px solid #374151;
        border-radius: 16px;
        padding: 20px;
        background: #111827;
      }
      .sidebar h2,
      .workflow-panel h2 {
        margin-top: 0;
        margin-bottom: 8px;
      }
      .sidebar-text,
      .workflow-panel p {
        margin-top: 0;
        margin-bottom: 16px;
        color: #9ca3af;
        font-size: 0.95rem;
      }
      .agent-toggles { display: grid; gap: 10px; }
      .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid #334155; border-radius: 12px; background: #1f2937; }
      .toggle-row label { display: flex; flex-direction: column; gap: 6px; margin: 0; font-size: 0.95rem; color: #e5e7eb; }
      .toggle-row label small { display: block; color: #9ca3af; font-size: 0.82rem; line-height: 1.4; }
      .message-meta { font-size: 0.8rem; color: #9ca3af; margin: 6px 0; }
      .chat-panel { display: flex; flex-direction: column; gap: 14px; }
      .header-row { display: flex; flex-direction: column; gap: 6px; }
      .app h1 { margin: 0; }
      .chat-window { border: 1px solid #374151; border-radius: 12px; padding: 16px; min-height: 320px; background: #1f2937; overflow-y: auto; }
      .message { margin-bottom: 16px; line-height: 1.5; }
      .message.user { text-align: right; }
      .message .role { font-size: 0.85rem; opacity: 0.8; }
      .message .bubble { display: inline-block; padding: 12px 16px; border-radius: 18px; max-width: 80%; white-space: pre-wrap; word-break: break-word; }
      .message.user .bubble { background: #2563eb; color: white; }
      .message.assistant .bubble { background: #374151; color: #f9fafb; }
      .controls { margin-top: 16px; display: grid; gap: 10px; }
      .workflow-window { border: 1px solid #334155; border-radius: 12px; padding: 16px; min-height: 320px; background: #0f172a; overflow-y: auto; }
      .workflow-entry { margin-bottom: 12px; padding: 12px; border-radius: 12px; background: #111827; border: 1px solid #24303f; }
      .workflow-entry strong { display: block; margin-bottom: 6px; color: #93c5fd; }
      .trace-content { margin: 0; white-space: pre-wrap; word-break: break-word; color: #d1d5db; font-family: inherit; font-size: 0.92rem; }
      textarea { width: 100%; min-height: 120px; border-radius: 12px; border: 1px solid #4b5563; padding: 12px; background: #111827; color: #e5e7eb; resize: vertical; }
      button { background: #10b981; border: none; border-radius: 10px; color: white; padding: 12px 18px; cursor: pointer; font-size: 1rem; }
      button:hover { background: #059669; }
      .status { font-size: 0.95rem; opacity: 0.85; }
      @media (max-width: 1160px) {
        .app { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>Agent Switches</h2>
        <p class="sidebar-text">Enable or disable agents before sending your request.</p>
        <div id="agentToggles" class="agent-toggles"></div>
      </aside>

      <main class="chat-panel">
        <div class="header-row">
          <h1>Orchestrator Chatbox</h1>
          <p class="status">Type a prompt and send it to the orchestrator backend.</p>
        </div>

        <div class="chat-window" id="chatWindow"></div>

        <div class="controls">
          <textarea id="messageInput" placeholder="Enter your message..."></textarea>
          <button id="sendButton">Send</button>
        </div>
      </main>

      <aside class="workflow-panel">
        <h2>Workflow Trace</h2>
        <p>See orchestrator decisions, selected agents, and agent invocation details.</p>
        <div id="workflowTrace" class="workflow-window"></div>
      </aside>
    </div>
    <script src="chat.js"></script>
  </body>
</html>
